plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

// Java 17 bytecode — runs on Java 17+ (Jenkins has Java 21, no separate JDK install needed)
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.27.0'
    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    implementation 'io.github.bonigarcia:webdrivermanager:5.9.2'
    testImplementation 'org.hamcrest:hamcrest:3.0'

    // TestNG — test framework (annotations, assertions, listeners, parallel execution)
    // 7.9.0 — newer versions (7.10+) are incompatible with Gradle's TestNG adapter
    testImplementation 'org.testng:testng:7.9.0'

    // Jackson — converts JSON responses into POJO objects (response.as(MyPojo.class))
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    def allureVersion = '2.29.0'
    testImplementation "io.qameta.allure:allure-testng:$allureVersion"
    testImplementation "io.qameta.allure:allure-rest-assured:$allureVersion"

    // SLF4J — logging API (write log messages using this)
    testImplementation 'org.slf4j:slf4j-api:2.0.16'

    // Logback — logging engine (actually writes the logs to console/file)
    testImplementation 'ch.qos.logback:logback-classic:1.5.12'
}

allure {
    version = '2.29.0'
}

// Deletes the test-output folder before every test run
// So old logs, screenshots and reports are cleared — only fresh data remains
task cleanTestOutput(type: Delete) {
    delete 'test-output'
}

// Copies the generated Allure report into test-output/reports
// Runs automatically after allureReport task
task copyAllureReport(type: Copy) {
    dependsOn allureReport
    from 'build/reports/allure-report'
    into 'test-output/reports'
}

// Common test configuration shared by all test tasks
def commonTestConfig = {
    dependsOn cleanTestOutput
    systemProperty 'allure.results.directory', 'test-output/allure-results'
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = "full"
    }
}

// Default task — runs the full suite defined in testng.xml
test {
    configure commonTestConfig
    useTestNG {
        suites 'src/test/resources/testng.xml'
    }
}

// Runs only tests in the "smoke" group
// Command: .\gradlew smokeTest
task smokeTest(type: Test) {
    configure commonTestConfig
    useTestNG {
        includeGroups 'smoke'
    }
}

// Runs only tests in the "ui" group
// Command: .\gradlew uiTest
task uiTest(type: Test) {
    configure commonTestConfig
    useTestNG {
        includeGroups 'ui'
    }
}

// Runs only tests in the "api" group
// Command: .\gradlew apiTest
task apiTest(type: Test) {
    configure commonTestConfig
    useTestNG {
        includeGroups 'api'
    }
}
